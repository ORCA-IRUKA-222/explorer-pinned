name: Probe
on:
  push:
    branches: ["fix/large-folder-regroup"]
    paths: ["tests/probe/**", ".github/workflows/probe.yml"]
jobs:
  probe:
    name: Probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -A x64 -DEP_BUILD_TESTS=OFF
          cmake --build build --config Release
          cmake -S tests/probe -B build-probe -A x64
          cmake --build build-probe --config Release
      - name: Run
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build-probe\Release\bigprobe.exe -ArgumentList "build\Release\ExplorerPinned.exe" `
            -NoNewWindow -PassThru -RedirectStandardOutput out.txt
          $null = $p.Handle
          if (-not $p.WaitForExit(1500000)) { "TIMEOUT"; $p.Kill() }
          Get-Content out.txt -Encoding utf8
