name: Probe
on:
  push:
    branches: ["fix/large-folder-regroup"]
    paths: ["tests/probe/**", ".github/workflows/probe.yml"]
jobs:
  probe:
    name: Probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S tests/probe -B build-probe -A x64
          cmake --build build-probe --config Release
      - name: Run
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build-probe\Release\schemaprobe.exe -NoNewWindow -PassThru -RedirectStandardOutput out.txt
          $null = $p.Handle
          if (-not $p.WaitForExit(900000)) { "TIMEOUT"; $p.Kill() }
          Get-Content out.txt -Encoding utf8
          Write-Host "---- Application event log"
          Get-WinEvent -LogName Application -MaxEvents 60 -ErrorAction SilentlyContinue |
            Where-Object { $_.TimeCreated -gt (Get-Date).AddMinutes(-20) } |
            ForEach-Object { "{0} {1} {2}: {3}" -f $_.TimeCreated.ToString("HH:mm:ss"), $_.ProviderName, $_.Id, ($_.Message -replace "\s+", " ") }
