name: Build

on:
  push:
    branches: [main, "feature/**", "fix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release tagged v<version in src/version.h>"
        type: boolean
        default: false
      target:
        description: "Commit for the release tag (default: the commit being built)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-2022
    strategy:
      matrix:
        # x86: the file dialog DLL for 32-bit programs (and a 32-bit test program)
        arch: [x64, arm64, x86]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch == 'x64' && 'x64' || matrix.arch == 'arm64' && 'ARM64' || 'Win32' }} -DEP_BUILD_TESTS=${{ matrix.arch == 'arm64' && 'OFF' || 'ON' }}
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: |
            build/Release/*.exe
            build/Release/*.dll
          if-no-files-found: error

  e2e:
    name: End-to-end test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bin-x64
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: bin-x86
          path: bin/x86
      - name: Run
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force screenshots | Out-Null
          New-Item -Path HKCU:\Software\ExplorerPinned -Force | Out-Null
          Set-ItemProperty -Path HKCU:\Software\ExplorerPinned -Name Log -Value "1"
          $p = Start-Process -FilePath bin\ExplorerPinnedE2E.exe -ArgumentList "bin\ExplorerPinned.exe", "$PWD\screenshots" `
            -NoNewWindow -PassThru -RedirectStandardOutput e2e.txt
          $null = $p.Handle
          $finished = $p.WaitForExit(1080000)
          if (-not $finished) { $p.Kill() }
          Get-Content e2e.txt -Encoding utf8
          Write-Host "---- agent.log"
          Get-Content "$env:TEMP\ep_agent.log" -Encoding utf8 -ErrorAction SilentlyContinue
          Write-Host "---- agent.log after uninstall"
          Get-Content "$env:LOCALAPPDATA\ExplorerPinned\agent.log" -Encoding utf8 -ErrorAction SilentlyContinue
          if (-not $finished) { Write-Error "E2E timed out"; exit 1 }
          exit $p.ExitCode
      - name: Convert screenshots
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Get-ChildItem "$PWD\screenshots\*.bmp" -ErrorAction SilentlyContinue | ForEach-Object {
            $img = [System.Drawing.Image]::FromFile($_.FullName)
            $img.Save([System.IO.Path]::ChangeExtension($_.FullName, ".png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $img.Dispose()
            Remove-Item $_.FullName
          }
          # The corner with the on/off button, printed so that it can be looked at from the log.
          foreach ($name in "explorer-button-on", "explorer-button-off", "dialog-button-on", "dialog-button-off") {
            $file = "$PWD\screenshots\$name.png"
            if (-not (Test-Path $file)) { continue }
            $img = [System.Drawing.Bitmap]::FromFile($file)
            $w = [Math]::Min(520, $img.Width); $h = [Math]::Min(170, $img.Height)
            $crop = $img.Clone((New-Object System.Drawing.Rectangle ($img.Width - $w), ($img.Height - $h), $w, $h), $img.PixelFormat)
            $ms = New-Object System.IO.MemoryStream
            $crop.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
            Write-Host "SHOT $name $([Convert]::ToBase64String($ms.ToArray()))"
            $crop.Dispose(); $img.Dispose()
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: screenshots
          if-no-files-found: ignore

  package:
    name: Package
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-x64
          path: dist/x64
      - uses: actions/download-artifact@v4
        with:
          name: bin-arm64
          path: dist/arm64
      - uses: actions/download-artifact@v4
        with:
          name: bin-x86
          path: dist/x86
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path src/version.h -Pattern 'EP_VERSION_STRING "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} /DBinDir=..\dist installer\ExplorerPinned.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build zip
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          foreach ($arch in "x64", "arm64") {
            $dir = "dist\ExplorerPinned-$v-$arch"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item "dist\$arch\ExplorerPinned.exe" $dir
            Copy-Item README.md, LICENSE $dir
            Compress-Archive -Path "$dir\*" -DestinationPath "dist\ExplorerPinned-$v-$arch.zip" -Force
          }
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/ExplorerPinned-Setup-*.exe
            dist/ExplorerPinned-*.zip
          if-no-files-found: error

  installer-test:
    name: Installer test
    needs: package
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - name: Install, check, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $setup = Get-ChildItem packages\ExplorerPinned-Setup-*.exe | Select-Object -First 1
          # Start-Process -Wait would also wait for the agent that setup starts, so wait for setup only.
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LANG=japanese", "/LOG=install.log" -PassThru
          if (-not $p.WaitForExit(300000)) { throw "setup timed out" }
          $exe = "$env:ProgramFiles\Explorer Pinned\ExplorerPinned.exe"
          if (-not (Test-Path $exe)) { Get-Content install.log; throw "not installed" }
          Start-Sleep -Seconds 3
          $status = & $exe status | Out-String
          Write-Host $status
          if ($status -notmatch "schema: registered \(ピン止め\)") { throw "schema not registered in Japanese" }
          if ($status -notmatch "menu: registered") { throw "menu not registered" }
          if ($status -notmatch "startup: on") { throw "startup entry missing" }
          if ($status -notmatch "agent: running") { throw "agent not running" }
          $menu = (Get-ItemProperty -LiteralPath "HKCU:\Software\Classes\*\shell\ExplorerPinned.Pin").MUIVerb
          Write-Host "menu text: $menu"
          if ($menu -ne "このファイルをピン止めする") { throw "unexpected menu text" }
          if ($status -notmatch "dialogs: registered \(on\)") { throw "file dialog support not registered" }
          $overlay = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\ShellIconOverlayIdentifiers\    ExplorerPinned"
          $overlay32 = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Explorer\ShellIconOverlayIdentifiers\    ExplorerPinned"
          if (-not (Test-Path -LiteralPath $overlay) -or -not (Test-Path -LiteralPath $overlay32)) { throw "dialog DLLs not registered" }

          # Installing again while a program has the dialog DLL loaded (it is moved aside).
          $dll = "$env:ProgramFiles\Explorer Pinned\ExplorerPinnedShell.dll"
          $handle = [System.Runtime.InteropServices.NativeLibrary]::Load($dll)
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LANG=japanese", "/LOG=reinstall.log" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) { throw "second setup timed out" }
          Start-Sleep -Seconds 3
          if ($p.ExitCode -ne 0) { Get-Content reinstall.log; throw "second setup failed: $($p.ExitCode)" }
          if (-not (Test-Path $dll)) { throw "DLL missing after installing again" }
          $old = Get-ChildItem "$env:ProgramFiles\Explorer Pinned\ExplorerPinnedShell.dll.*.old"
          Write-Host "moved aside: $($old.Name)"
          if (-not $old) { throw "the loaded DLL was not moved aside" }
          [System.Runtime.InteropServices.NativeLibrary]::Free($handle)
          $status = & $exe status | Out-String
          if ($status -notmatch "dialogs: registered \(on\)") { throw "file dialog support not registered after installing again" }

          $uninstaller = Get-ChildItem "$env:ProgramFiles\Explorer Pinned\unins*.exe" | Select-Object -First 1
          $p = Start-Process $uninstaller.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          if (-not $p.WaitForExit(300000)) { throw "uninstall timed out" }
          # The uninstaller copies itself to %TEMP% and finishes there.
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "files left behind" }
          if (Test-Path -LiteralPath "HKCU:\Software\Classes\*\shell\ExplorerPinned.Pin") { throw "menu left behind" }
          if (Test-Path "HKCU:\Software\ExplorerPinned") { throw "settings left behind" }
          if (Test-Path "$env:LOCALAPPDATA\ExplorerPinned") { throw "log left behind" }
          if (Test-Path "$env:ProgramData\ExplorerPinned") { throw "schema file left behind" }
          if ((Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run).ExplorerPinned) { throw "startup entry left behind" }
          $schemas = Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\PropertySystem\PropertySchema" -ErrorAction SilentlyContinue |
            ForEach-Object { (Get-ItemProperty $_.PSPath).PSObject.Properties.Value } | Where-Object { "$_" -like "*ExplorerPinned*" }
          if ($schemas) { throw "schema left behind: $schemas" }
          if (Get-Process ExplorerPinned -ErrorAction SilentlyContinue) { throw "agent still running" }
          if ((Test-Path -LiteralPath $overlay) -or (Test-Path -LiteralPath $overlay32)) { throw "dialog DLLs still registered" }
          if (Test-Path "HKLM:\SOFTWARE\Classes\CLSID\{432E90E6-6BCF-44FE-9F87-8BA191F04870}") { throw "DLL class left behind" }
          Write-Host "installer test passed"

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [e2e, package, installer-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/.*EP_VERSION_STRING "\(.*\)"/\1/p' src/version.h)"
          fi
          gh release create "$tag" packages/* --repo "$GITHUB_REPOSITORY" --target "${TARGET:-$GITHUB_SHA}" \
            --title "Explorer Pinned ${tag#v}" --notes-file .github/release-notes.md --generate-notes
