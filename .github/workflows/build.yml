name: Build

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch == 'x64' && 'x64' || 'ARM64' }} -DEP_BUILD_TESTS=${{ matrix.arch == 'x64' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: build/Release/*.exe
          if-no-files-found: error

  e2e:
    name: End-to-end test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bin-x64
          path: bin
      - name: Run
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force screenshots | Out-Null
          New-Item -Path HKCU:\Software\ExplorerPinned -Force | Out-Null
          Set-ItemProperty -Path HKCU:\Software\ExplorerPinned -Name Log -Value "1"
          $p = Start-Process -FilePath bin\ExplorerPinnedE2E.exe -ArgumentList "bin\ExplorerPinned.exe", "$PWD\screenshots" `
            -NoNewWindow -PassThru -RedirectStandardOutput e2e.txt
          $null = $p.Handle
          $finished = $p.WaitForExit(600000)
          if (-not $finished) { $p.Kill() }
          Get-Content e2e.txt -Encoding utf8
          Write-Host "---- agent.log"
          Get-Content "$env:LOCALAPPDATA\ExplorerPinned\agent.log" -Encoding utf8 -ErrorAction SilentlyContinue
          if (-not $finished) { Write-Error "E2E timed out"; exit 1 }
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: screenshots
          if-no-files-found: ignore

  package:
    name: Package
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-x64
          path: dist/x64
      - uses: actions/download-artifact@v4
        with:
          name: bin-arm64
          path: dist/arm64
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path src/version.h -Pattern 'EP_VERSION_STRING "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} /DBinDir=..\dist installer\ExplorerPinned.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build zip
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          foreach ($arch in "x64", "arm64") {
            $dir = "dist\ExplorerPinned-$v-$arch"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item "dist\$arch\ExplorerPinned.exe" $dir
            Copy-Item README.md, LICENSE $dir
            Compress-Archive -Path "$dir\*" -DestinationPath "dist\ExplorerPinned-$v-$arch.zip" -Force
          }
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/ExplorerPinned-Setup-*.exe
            dist/ExplorerPinned-*.zip
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [e2e, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/* \
            --repo "$GITHUB_REPOSITORY" --title "Explorer Pinned ${GITHUB_REF_NAME#v}" --generate-notes
